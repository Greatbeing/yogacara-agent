<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgS" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#232e47"/>
      <stop offset="55%" stop-color="#171e2e"/>
      <stop offset="100%" stop-color="#0d111c"/>
    </radialGradient>
    <linearGradient id="petalS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd0ff"/>
      <stop offset="55%" stop-color="#4da3ff"/>
      <stop offset="100%" stop-color="#2b6fd4"/>
