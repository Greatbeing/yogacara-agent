      <path transform="rotate(45)"  d="M 0 -200 C 46 -150 58 -84 58 -34 C 58 14 30 46 0 60 C -30 46 -58 14 -58 -34 C -58 -84 -46 -150 0 -200 Z"/>
      <path transform="rotate(90)"  d="M 0 -200 C 46 -150 58 -84 58 -34 C 58 14 30 46 0 60 C -30 46 -58 14 -58 -34 C -58 -84 -46 -150 0 -200 Z"/>
      <path transform="rotate(135)" d="M 0 -200 C 46 -150 58 -84 58 -34 C 58 14 30 46 0 60 C -30 46 -58 14 -58 -34 C -58 -84 -46 -150 0 -200 Z"/>
      <path transform="rotate(180)" d="M 0 -200 C 46 -150 58 -84 58 -34 C 58 14 30 46 0 60 C -30 46 -58 14 -58 -34 C -58 -84 -46 -150 0 -200 Z"/>
      <path transform="rotate(225)" d="M 0 -200 C 46 -150 58 -84 58 -34 C 58 14 30 46 0 60 C -30 46 -58 14 -58 -34 C -58 -84 -46 -150 0 -200 Z"/>
      <path transform="rotate(270)" d="M 0 -200 C 46 -150 58 -84 58 -34 C 58 14 30 46 0 60 C -30 46 -58 14 -58 -34 C -58 -84 -46 -150 0 -200 Z"/>
      <path transform="rotate(315)" d="M 0 -200 C 46 -150 58 -84 58 -34 C 58 14 30 46 0 60 C -30 46 -58 14 -58 -34 C -58 -84 -46 -150 0 -200 Z"/>
