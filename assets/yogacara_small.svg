<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Yogacara 「八转四」Logo · 小尺寸变体（16/32/48px）
       粗刀刃 + 大金蕊，去腰线环；缩到 16px 仍清晰分辨实心/描边交替 -->
  <defs>
    <radialGradient id="bgS" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#1a2334"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </radialGradient>
    <radialGradient id="coreGradS" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#e8940a"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bgS)"/>

  <g transform="translate(256,256)">
    <!-- 正位 ×4：亮蓝（四智） -->
    <g fill="#7cc4ff">
      <polygon points="0,-68 42,-128 0,-198 -42,-128" transform="rotate(0)"/>
      <polygon points="0,-68 42,-128 0,-198 -42,-128" transform="rotate(90)"/>
      <polygon points="0,-68 42,-128 0,-198 -42,-128" transform="rotate(180)"/>
      <polygon points="0,-68 42,-128 0,-198 -42,-128" transform="rotate(270)"/>
    </g>
    <!-- 斜位 ×4：深蓝（在转的识）——以明度而非线条做 16px 对比 -->
    <g fill="#2e63a8">
      <polygon points="0,-68 42,-128 0,-198 -42,-128" transform="rotate(45)"/>
      <polygon points="0,-68 42,-128 0,-198 -42,-128" transform="rotate(135)"/>
      <polygon points="0,-68 42,-128 0,-198 -42,-128" transform="rotate(225)"/>
      <polygon points="0,-68 42,-128 0,-198 -42,-128" transform="rotate(315)"/>
    </g>

    <circle cx="0" cy="0" r="52" fill="url(#coreGradS)"/>
    <ellipse cx="-13" cy="-15" rx="14" ry="10" fill="#ffffff" opacity="0.5"
             transform="rotate(-32 -13 -15)"/>
  </g>
  </g>
</svg>
