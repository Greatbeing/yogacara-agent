<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Yogacara 「八转四」Logo · 主版
       8 枚菱形刀刃 = 八识；实心×4 = 已转成的四智；描边×4 = 在转的现行识；
       中心金点 = 阿赖耶识自性 -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#1a2334"/>
      <stop offset="55%" stop-color="#121828"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#e8940a"/>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none"
        stroke="#2a3450" stroke-width="3"/>

  <g transform="translate(256,256)">
    <!-- 腰线细环：构造感细节（大尺寸可见） -->
    <circle cx="0" cy="0" r="126" fill="none" stroke="#223047" stroke-width="2"/>

    <!-- 实心刀刃 ×4（正位）：转成的四智 -->
    <g fill="#5aabf5">
      <polygon points="0,-58 25,-126 0,-192 -25,-126" transform="rotate(0)"/>
      <polygon points="0,-58 25,-126 0,-192 -25,-126" transform="rotate(90)"/>
      <polygon points="0,-58 25,-126 0,-192 -25,-126" transform="rotate(180)"/>
      <polygon points="0,-58 25,-126 0,-192 -25,-126" transform="rotate(270)"/>
    </g>
    <!-- 描边刀刃 ×4（斜位）：仍在流转的四识 -->
    <g fill="none" stroke="#39b7ff" stroke-width="13">
      <polygon points="0,-58 25,-126 0,-192 -25,-126" transform="rotate(45)"/>
      <polygon points="0,-58 25,-126 0,-192 -25,-126" transform="rotate(135)"/>
      <polygon points="0,-58 25,-126 0,-192 -25,-126" transform="rotate(225)"/>
      <polygon points="0,-58 25,-126 0,-192 -25,-126" transform="rotate(315)"/>
    </g>

    <!-- 金蕊 -->
    <circle cx="0" cy="0" r="34" fill="url(#coreGrad)"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#b8860b" stroke-width="2" opacity="0.65"/>
    <ellipse cx="-9" cy="-10" rx="10" ry="7" fill="#ffffff" opacity="0.55"
             transform="rotate(-32 -9 -10)"/>
  </g>
</svg>
