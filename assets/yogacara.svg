<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 背景渐变圆 -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d2538"/>
      <stop offset="100%" stop-color="#0f1420"/>
    </radialGradient>
    <!-- 花瓣渐变 -->
    <linearGradient id="petal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ec8ff"/>
      <stop offset="60%" stop-color="#4da3ff"/>
      <stop offset="100%" stop-color="#2b7de9"/>
    </linearGradient>
    <!-- 花瓣内发光 -->
    <radialGradient id="petalGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <!-- 中心光晕 -->
    <radialGradient id="center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </radialGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="#2a3450" stroke-width="2"/>

  <!-- 八识 · 八瓣莲花 -->
  <g transform="translate(128,128)">
    <!-- 8 片花瓣，均匀分布 -->
    <g transform="rotate(0)">
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petal)" opacity="0.92"/>
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petalGlow)"/>
    </g>
    <g transform="rotate(45)">
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petal)" opacity="0.88"/>
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petalGlow)"/>
    </g>
    <g transform="rotate(90)">
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petal)" opacity="0.85"/>
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petalGlow)"/>
    </g>
    <g transform="rotate(135)">
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petal)" opacity="0.82"/>
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petalGlow)"/>
    </g>
    <g transform="rotate(180)">
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petal)" opacity="0.80"/>
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petalGlow)"/>
    </g>
    <g transform="rotate(225)">
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petal)" opacity="0.78"/>
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petalGlow)"/>
    </g>
    <g transform="rotate(270)">
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petal)" opacity="0.76"/>
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petalGlow)"/>
    </g>
    <g transform="rotate(315)">
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petal)" opacity="0.74"/>
      <ellipse cx="0" cy="-52" rx="18" ry="38" fill="url(#petalGlow)"/>
    </g>

    <!-- 花蕊（金色中心） -->
    <circle cx="0" cy="0" r="16" fill="url(#center)"/>
    <circle cx="0" cy="0" r="10" fill="#fff8e1" opacity="0.5"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff" opacity="0.7"/>

    <!-- 外圈光环（禅圆 ensō） -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#4da3ff" stroke-width="1.5"
            stroke-dasharray="40 12 8 12" opacity="0.3"
            transform="rotate(-30)"/>
  </g>

  <!-- 底部文字 -->
  <text x="128" y="218" text-anchor="middle" font-family="serif" font-size="16"
        fill="#7c8bb0" letter-spacing="4">唯 識</text>
</svg>
