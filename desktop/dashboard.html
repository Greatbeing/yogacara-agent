<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>唯识进化框架 · Web Dashboard</title>
<link rel="icon" type="image/svg+xml" href="../assets/yogacara.svg">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --panel2: #1d2538;
    --border: #2a3450;
    --text: #dbe4f5;
    --muted: #7c8bb0;
    --accent: #4da3ff;
    --good: #2ed573;
    --bad: #ff4757;
    --gold: #ffd700;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    font-size: 13px;
  }
  header, footer, section { width: 100%; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; }
  header .status { margin-left: auto; color: var(--muted); }
  main { padding: 12px 16px 16px; display: grid; gap: 12px; grid-template-columns: 1.2fr 1fr; }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
  }
  .panel h2 { font-size: 12px; color: var(--muted); margin: 0 0 10px; letter-spacing: 0.04em; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, input, select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 10px; font: inherit;
  }
  button { cursor: pointer; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .card { background: var(--panel2); border-radius: 8px; padding: 10px; }
  .card .label { color: var(--muted); font-size: 11px; }
  .card .value { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .bar { height: 6px; border-radius: 999px; overflow: hidden; background: #2a3450; margin-top: 8px; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .grid {
    display: grid; grid-template-columns: repeat(10, 28px); gap: 2px; background: var(--border);
    padding: 2px; border-radius: 6px; width: fit-content;
  }
  .cell { width: 28px; height: 28px; background: #121826; position: relative; }
  .cell.resource { background: rgba(46, 213, 115, 0.15); }
  .cell.trap { background: rgba(255, 71, 87, 0.15); }
  .cell.agent::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--gold); }
  .split { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .list { max-height: 260px; overflow: auto; display: grid; gap: 6px; }
  .item { background: var(--panel2); border-radius: 6px; padding: 8px 10px; }
  .item .meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
  canvas { width: 100%; height: 180px; display: block; background: #111725; border-radius: 6px; }
  .empty { color: var(--muted); padding: 10px 0; }
  .wide { grid-column: 1 / -1; }
  .table { width: 100%; border-collapse: collapse; }
  .table td, .table th { padding: 6px 8px; border-bottom: 1px solid #263149; text-align: left; }
  .table th { color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
  <header>
    <h1>唯识进化框架 Web Dashboard</h1>
    <div class="status" id="conn-status">连接中</div>
  </header>
  <main>
    <section class="panel">
      <h2>运行控制</h2>
      <div class="toolbar">
        <input id="steps" type="number" min="1" max="200" value="60">
        <button class="primary" id="run-btn">运行 Episode</button>
        <button id="snapshot-btn">记录快照</button>
      </div>
      <div class="cards" style="margin-top:12px;">
        <div class="card"><div class="label">步数</div><div class="value" id="step-value">0</div></div>
        <div class="card"><div class="label">累计奖励</div><div class="value" id="reward-value">0.0</div></div>
        <div class="card"><div class="label">末那拦截</div><div class="value" id="manas-value">0</div></div>
        <div class="card"><div class="label">种子数量</div><div class="value" id="seed-value">0</div></div>
      </div>
      <div class="split" style="margin-top:12px;">
        <div>
          <h2>网格世界</h2>
          <div class="grid" id="grid"></div>
        </div>
        <div>
          <h2>四智指标</h2>
          <div class="list" id="wisdom-list"></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>种子演化</h2>
      <canvas id="evolution-canvas" width="600" height="180"></canvas>
      <div class="split" style="margin-top:12px;">
        <div>
          <h2>演化快照</h2>
          <div class="list" id="snapshot-list"></div>
        </div>
        <div>
          <h2>末那事件</h2>
          <div class="list" id="event-list"></div>
        </div>
      </div>
    </section>

    <section class="panel wide">
      <h2>种子详情</h2>
      <div class="toolbar">
        <select id="seed-filter"><option value="">全部类型</option><option value="名言种">名言种</option><option value="业种">业种</option><option value="异熟种">异熟种</option></select>
        <button id="reload-seeds">刷新种子</button>
      </div>
      <table class="table" style="margin-top:12px;">
        <thead><tr><th>步数</th><th>类型</th><th>动作</th><th>奖励</th><th>重要性</th><th>对齐</th><th>三性</th></tr></thead>
        <tbody id="seed-body"></tbody>
      </table>
      <div class="empty" id="seed-empty" style="display:none;">暂无种子数据</div>
    </section>
  </main>

<script>
const state = { statusTimer: null, seedTimer: null, snapshotTimer: null, latestStatus: null, latestSnapshots: [] };
const gridEl = document.getElementById('grid');
for (let i = 0; i < 100; i++) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.dataset.idx = i;
  gridEl.appendChild(cell);
}

function setStatus(text, color) {
  const el = document.getElementById('conn-status');
  el.textContent = text;
  el.style.color = color || 'var(--muted)';
}

function renderGrid(pos) {
  gridEl.querySelectorAll('.cell').forEach((cell) => {
    cell.className = 'cell';
    cell.style.boxShadow = '';
  });
  if (!pos) return;
  const resources = Array.isArray(pos.resources) ? pos.resources : [];
  const traps = Array.isArray(pos.traps) ? pos.traps : [];
  const path = Array.isArray(pos.path) ? pos.path : [];
  resources.forEach(([r, c]) => {
    const cell = gridEl.querySelector(`.cell[data-idx="${r * 10 + c}"]`);
    if (cell) cell.classList.add('resource');
  });
  traps.forEach(([r, c]) => {
    const cell = gridEl.querySelector(`.cell[data-idx="${r * 10 + c}"]`);
    if (cell) cell.classList.add('trap');
  });
  path.forEach(([r, c]) => {
    const cell = gridEl.querySelector(`.cell[data-idx="${r * 10 + c}"]`);
    if (cell && !cell.classList.contains('resource') && !cell.classList.contains('trap')) cell.style.boxShadow = 'inset 0 0 0 1px rgba(77,163,255,0.3)';
  });
  if (Array.isArray(pos.agent_pos) && pos.agent_pos.length === 2) {
    const idx = pos.agent_pos[0] * 10 + pos.agent_pos[1];
    const cell = gridEl.querySelector(`.cell[data-idx="${idx}"]`);
    if (cell) cell.classList.add('agent');
  }
}

function renderWisdom(wisdom) {
  const el = document.getElementById('wisdom-list');
  el.textContent = '';
  const items = [
    ['大圆镜智', wisdom['大圆镜智']],
    ['平等性智', wisdom['平等性智']],
    ['妙观察智', wisdom['妙观察智']],
    ['成所作智', wisdom['成所作智']],
  ];
  items.forEach(([name, value]) => {
    const row = document.createElement('div');
    row.className = 'item';
    const score = typeof value === 'object' && value !== null ? (value.score ?? value.ratio ?? value.execution_rate ?? 0) : (value || 0);
    const title = document.createElement('div');
    title.textContent = name;
    const bar = document.createElement('div');
    bar.className = 'bar';
    const fill = document.createElement('span');
    fill.style.width = `${Math.max(0, Math.min(100, score * 100))}%`;
    bar.appendChild(fill);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${Math.round(score * 1000) / 10}%`;
    row.appendChild(title);
    row.appendChild(bar);
    row.appendChild(meta);
    el.appendChild(row);
  });
}

function renderSnapshots(snaps) {
  const list = document.getElementById('snapshot-list');
  list.textContent = '';
  if (!snaps.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '暂无演化快照';
    list.appendChild(empty);
    return;
  }
  snaps.slice(-8).reverse().forEach((snap) => {
    const item = document.createElement('div');
    item.className = 'item';
    item.textContent = `种子 ${snap.total_seeds} | 重要性 ${snap.avg_importance.toFixed(3)} | 对齐 ${snap.avg_alignment.toFixed(3)}`;
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = new Date(snap.ts * 1000).toLocaleString();
    item.appendChild(meta);
    list.appendChild(item);
  });
}

function renderEvents(status) {
  const list = document.getElementById('event-list');
  list.textContent = '';
  const events = Array.isArray(status?.events) ? status.events : [];
  if (!events.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '暂无末那拦截记录';
    list.appendChild(empty);
    return;
  }
  events.slice(-8).reverse().forEach((event) => {
    const item = document.createElement('div');
    item.className = 'item';
    item.textContent = `step ${event.step} | ${event.nature || ''}`;
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = event.reasoning || '';
    item.appendChild(meta);
    list.appendChild(item);
  });
}

function renderSeeds(seeds) {
  const body = document.getElementById('seed-body');
  const empty = document.getElementById('seed-empty');
  body.textContent = '';
  if (!seeds.length) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  seeds.slice().reverse().slice(0, 50).forEach((seed) => {
    const tr = document.createElement('tr');
    const cells = [
      seed.step ?? '',
      seed.seed_type ?? '',
      seed.action ?? '',
      Number(seed.reward ?? 0).toFixed(2),
      Number(seed.importance ?? 0).toFixed(3),
      Number(seed.align ?? 0).toFixed(3),
      seed.nature ?? '',
    ];
    cells.forEach((value) => {
      const td = document.createElement('td');
      td.textContent = String(value);
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

function drawEvolution(snaps) {
  const canvas = document.getElementById('evolution-canvas');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#111725';
  ctx.fillRect(0, 0, w, h);
  if (!snaps.length) return;
  const maxSeeds = Math.max(...snaps.map((s) => s.total_seeds), 1);
  const maxImp = Math.max(...snaps.map((s) => s.avg_importance), 1);
  const pad = 18;
  const step = (w - pad * 2) / Math.max(snaps.length - 1, 1);
  function drawLine(getY, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    snaps.forEach((snap, idx) => {
      const x = pad + idx * step;
      const y = h - pad - getY(snap) * (h - pad * 2);
      if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }
  drawLine((s) => s.total_seeds / maxSeeds, '#4da3ff');
  drawLine((s) => s.avg_importance / maxImp, '#2ed573');
}

async function fetchJson(url, options) {
  const res = await fetch(url, options);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function refreshStatus() {
  try {
    const data = await fetchJson('/api/agent/status');
    state.latestStatus = data;
    setStatus('在线', 'var(--good)');
    document.getElementById('step-value').textContent = data.step ?? 0;
    document.getElementById('reward-value').textContent = Number(data.cumulative_reward ?? 0).toFixed(2);
    document.getElementById('manas-value').textContent = data.manas_reflections ?? 0;
    document.getElementById('seed-value').textContent = data.seed_count ?? 0;
    renderGrid(data);
    renderWisdom(data.wisdom || {});
    renderEvents(data);
  } catch (err) {
    setStatus('连接失败', 'var(--bad)');
  }
}

async function refreshSnapshots() {
  try {
    const data = await fetchJson('/api/evolution/snapshots?limit=100');
    state.latestSnapshots = data.snapshots || [];
    renderSnapshots(state.latestSnapshots);
    drawEvolution(state.latestSnapshots);
  } catch (err) {
    console.error(err);
  }
}

async function refreshSeeds() {
  try {
    const type = document.getElementById('seed-filter').value;
    const url = type ? `/memory/seeds?seed_type=${encodeURIComponent(type)}&limit=50` : '/memory/seeds?limit=50';
    renderSeeds(await fetchJson(url));
  } catch (err) {
    console.error(err);
  }
}

async function runEpisode() {
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  try {
    await fetchJson('/run_episode', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({max_steps: Number(document.getElementById('steps').value || 60)})
    });
    await refreshStatus();
    await refreshSnapshots();
    await refreshSeeds();
  } catch (err) {
    setStatus('运行失败', 'var(--bad)');
  } finally {
    btn.disabled = false;
  }
}

async function recordSnapshot() {
  await fetchJson('/api/evolution/snapshot', {method: 'POST'});
  await refreshSnapshots();
}

document.getElementById('run-btn').addEventListener('click', runEpisode);
document.getElementById('snapshot-btn').addEventListener('click', recordSnapshot);
document.getElementById('reload-seeds').addEventListener('click', refreshSeeds);
document.getElementById('seed-filter').addEventListener('change', refreshSeeds);

refreshStatus();
refreshSnapshots();
refreshSeeds();
state.statusTimer = setInterval(refreshStatus, 2000);
state.snapshotTimer = setInterval(refreshSnapshots, 5000);
state.seedTimer = setInterval(refreshSeeds, 10000);
</script>
</body>
</html>
